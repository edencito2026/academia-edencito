<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aula Virtual</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: #1e293b; border-bottom: 1px solid #334155; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .curso-item { background: #1e293b; padding: 1.5rem; border-radius: 10px; margin-bottom: 1rem; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    /* Reproductor */
    #reproductor { display: none; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    @media(max-width: 768px) { #reproductor { grid-template-columns: 1fr; } }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: black; border-radius: 10px; overflow: hidden; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .lecciones-lista { background: #1e293b; border-radius: 10px; padding: 1rem; border: 1px solid #334155; }
    .leccion-btn { width: 100%; text-align: left; background: #0f172a; color: white; padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 6px; border: 1px solid #334155; }
    .leccion-btn:hover, .leccion-btn.activa { border-color: #38bdf8; color: #38bdf8; }
    .btn-material { display: none; margin-top: 0.5rem; background: #4ade80; color: #052e16; text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: bold; width: fit-content; }
    .btn-material:hover { background: #22c55e; color: white; }
  </style>
</head>
<body>

<header>
  <div><strong style="color:#38bdf8">Mi Aula Virtual</strong> | <span id="userEmail" style="font-size:0.9rem; color:#94a3b8"></span></div>
  <div>
    <button style="background:#475569; color:white; margin-right:0.5rem;" onclick="location.href='index.html'">Inicio</button>
    <button style="background:#ef4444; color:white;" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<div class="container">
  <div id="vista-cursos">
    <h2>Mis Cursos Activos</h2>
    <div id="lista-mis-cursos">Verificando accesos...</div>
  </div>

  <!-- Vista de clases -->
  <div id="reproductor">
    <div>
      <button onclick="volverACursos()" style="margin-bottom:1rem; background:#334155; color:white;">← Volver a mis cursos</button>
      <div class="video-wrapper">
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
      </div>
      <h2 id="tituloLeccionActual" style="margin-top:1rem; margin-bottom:0.5rem;"></h2>
      <a id="btnMaterial" class="btn-material" href="#" target="_blank" rel="noopener">Descargar material de clase</a>
    </div>
    <div class="lecciones-lista">
      <h3 style="margin-top:0">Contenido del curso</h3>
      <div id="lista-lecciones"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  let usuarioActual = null;
  let leccionesActuales = [];

  async function iniciar() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    usuarioActual = session.user;
    document.getElementById('userEmail').innerText = usuarioActual.email;
    cargarCursosComprados();
  }

  async function cargarCursosComprados() {
    const { data: accesos, error } = await _supabase
      .from('accesos')
      .select('curso_id, cursos(id, titulo, descripcion)')
      .eq('user_id', usuarioActual.id);

    const contenedor = document.getElementById('lista-mis-cursos');

    if (error) {
      contenedor.innerHTML = `<p style="color:#f87171;">Error al verificar accesos: ${error.message}</p>`;
      return;
    }

    if (!accesos || accesos.length === 0) {
      const msg = encodeURIComponent(`Hola, ya realicé el pago. Mi correo registrado es: ${usuarioActual.email}`);
      contenedor.innerHTML = `
        <div style="background:#1e293b; padding:2rem; border-radius:10px; border:1px solid #334155;">
          <h3>Aún no tienes cursos activados</h3>
          <p style="color:#94a3b8;">Si ya realizaste el pago, envíame tu correo (<strong>${usuarioActual.email}</strong>) por WhatsApp para activarte el acceso de inmediato.</p>
          <button style="background:#22c55e; color:#052e16;" onclick="window.open('https://wa.me/${WHATSAPP_NUMERO}?text=${msg}', '_blank')">Enviar correo por WhatsApp</button>
        </div>`;
      return;
    }

    contenedor.innerHTML = accesos.map(a => `
      <div class="curso-item">
        <div>
          <h3 style="margin:0 0 0.4rem 0">${a.cursos.titulo}</h3>
          <p style="margin:0; color:#94a3b8; font-size:0.9rem;">${a.cursos.descripcion || ''}</p>
        </div>
        <button onclick="abrirCurso('${a.cursos.id}')">Entrar a clases</button>
      </div>
    `).join('');
  }

  async function abrirCurso(cursoId) {
    const { data: lecciones, error } = await _supabase
      .from('lecciones')
      .select('*')
      .eq('curso_id', cursoId)
      .order('orden', { ascending: true });

    if (error) {
      alert("Error al cargar lecciones: " + error.message);
      return;
    }

    if (!lecciones || lecciones.length === 0) {
      alert("Este curso aún no tiene lecciones subidas.");
      return;
    }

    leccionesActuales = lecciones;
    document.getElementById('vista-cursos').style.display = 'none';
    document.getElementById('reproductor').style.display = 'grid';

    const lista = document.getElementById('lista-lecciones');
    lista.innerHTML = lecciones.map((l, index) => `
      <button class="leccion-btn" onclick="reproducir(${index}, this)">
        ${index + 1}. ${l.titulo}
      </button>
    `).join('');

    // Reproducir primera lección por defecto
    reproducir(0, lista.firstElementChild);
  }

  function reproducir(index, boton) {
    const leccion = leccionesActuales[index];
    document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${leccion.youtube_id}?rel=0`;
    document.getElementById('tituloLeccionActual').innerText = leccion.titulo;

    const btnMaterial = document.getElementById('btnMaterial');
    if (leccion.material_url) {
      btnMaterial.href = leccion.material_url;
      btnMaterial.style.display = 'inline-block';
    } else {
      btnMaterial.style.display = 'none';
    }

    document.querySelectorAll('.leccion-btn').forEach(b => b.classList.remove('activa'));
    if (boton) boton.classList.add('activa');
  }

  function volverACursos() {
    document.getElementById('videoFrame').src = '';
    document.getElementById('reproductor').style.display = 'none';
    document.getElementById('vista-cursos').style.display = 'block';
  }

  async function cerrarSesion() {
    await _supabase.auth.signOut();
    window.location.href = 'index.html';
  }

  iniciar();
</script>
</body>
</html>
